# pyrefly config. Reuses the `ty/master` venv (see ty/master/pyproject.toml)
# instead of maintaining a second, near-duplicate dependency environment —
# `python-interpreter-path` points pyrefly at that venv's interpreter so it
# resolves third-party imports the same way `ty` does.
python-interpreter-path = "ty/master/.venv/bin/python"

# That venv has every in-repo package editable-installed. Without this,
# pyrefly's default heuristic auto-excludes every editable-installed source
# dir it finds via the interpreter (treating our own packages as
# "dependencies" to skip), which would silently drop all of python_modules/*
# etc. from `project-includes`.
disable-project-excludes-heuristics = true

# Generated code (protobuf `_pb2.pyi` stubs, GraphQL codegen, etc.) is
# regenerated by its own tooling, not hand-suppressible — pyrefly detects
# it via the standard `@generated` marker comment.
ignore-errors-in-generated-code = true

# Mirrors `[tool.ty].extra-paths` in ty/master/pyproject.toml: `quickstart_etl`
# is a src-layout example that isn't installed into the venv, so its tests
# can't resolve the package by name without this.
search-path = ["examples/quickstart_etl/src"]

# The codebase already carries extensive `# ty: ignore[...]` suppressions
# for ty's equivalent narrowing/attribute-inference false positives (see
# ty/master/pyproject.toml's [tool.ty.rules] for the same class of issue).
# Respecting those too avoids re-litigating findings already triaged for
# the other type checker, on top of `# type: ignore` and `# pyrefly: ignore`.
enabled-ignores = ["type", "pyrefly", "ty"]

# Mirrors `[tool.ty.src].include` in ty/master/pyproject.toml.
project-includes = [
  "examples/**",
  "python_modules/**",
  "docs/sphinx/_ext/dagster-sphinx/**",
  "integration_tests/**",
  "scripts/**",
]

project-excludes = [
  # Not part of ty/master's scope either: it's not editable-installed in
  # the reused venv (only dagster-cloud-cli is), so it has no dependency
  # tree here to check against.
  "python_modules/dagster-cloud/**",
  # Newer libraries/* packages not yet added as deps to ty/master either,
  # so not editable-installed in the reused venv.
  "python_modules/libraries/dagster-hightouch/**",
  "python_modules/libraries/dagster-omni/**",
  # Airflow-bound packages: owned by the separate `ty/airflow` env (pinned to
  # sqlalchemy 1.x), and not installed in the reused `ty/master` venv.
  # Mirrors ty/master's exclude.
  "python_modules/libraries/dagster-airflow/**",
  "python_modules/libraries/dagster-airlift/**",
  "examples/airlift-federation-tutorial/**",
  "examples/airlift-migration-tutorial/**",
  "examples/airlift-mwaa-example/**",
  "examples/starlift-demo/**",
  # Vendored third-party code (croniter, dateutil).
  "python_modules/dagster/dagster/_vendored/**",
  # Documentation example trees reference community / scaffolded packages
  # not installed in this env; type-checking them generates spurious
  # unresolved-import diagnostics. Mirrors ty/master's exclude.
  "examples/docs_snippets/**",
  "examples/docs_projects/**",
  # Example notebook intentionally references undefined names as placeholders.
  "python_modules/libraries/dagstermill/dagstermill/examples/notebooks/yield_something.ipynb",
  # Deliberately-malformed scaffold used as a fixture for notebook-creation tests.
  "python_modules/libraries/dagstermill/dagstermill_tests/notebooks/cli_test_scaffold.ipynb",
]

# graphene's ObjectType/Mutation/InputObjectType/Interface metaclass
# synthesizes __init__ kwargs and resolves Field/NonNull/List class-body
# declarations to plain runtime values, none of which graphene exposes via
# `@dataclass_transform` or real stubs. Pyrefly (like ty; see the
# equivalent `[[tool.ty.overrides]]` in ty/master/pyproject.toml) sees the
# class-body descriptors literally and flags nearly every field
# access/assignment/construction in these two subtrees.
[[sub-config]]
matches = "python_modules/dagster-graphql/dagster_graphql/schema/**"

[sub-config.errors]
unexpected-keyword = false
bad-argument-type = false
bad-assignment = false
bad-return = false
missing-attribute = false
bad-argument-count = false
missing-argument = false
bad-index = false
bad-override = false
not-iterable = false

[[sub-config]]
matches = "python_modules/dagster-graphql/dagster_graphql/implementation/**"

[sub-config.errors]
unexpected-keyword = false
bad-argument-type = false
bad-assignment = false
bad-return = false
missing-attribute = false
bad-argument-count = false
missing-argument = false
bad-index = false
bad-override = false
not-iterable = false
